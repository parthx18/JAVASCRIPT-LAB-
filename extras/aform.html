<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center>
        <table border="1" cellpadding="16" cellspacing="0">
            <tr>
                <td>
                    <h1>Student Registration Form</h1>
                    <form method="post">
                        <label for="firstName">First Name</label><br>
                        <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required><br><br>

                        <label for="lastName">Last Name</label><br>
                        <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required><br><br>

                        <label for="email">Email Address</label><br>
                        <input type="email" id="email" name="email" placeholder="Enter email address" required><br><br>

                        <label for="phone">Phone Number</label><br>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number"><br><br>

                        <label for="dob">Date of Birth</label><br>
                        <input type="date" id="dob" name="dob"><br><br>

                        <label for="gender">Gender</label><br>
                        <select id="gender" name="gender">
                            <option value="">Select gender</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                            <option value="other">Other</option>
                            <option value="preferNot">Prefer not to say</option>
                        </select><br><br>

                        <label for="course">Course</label><br>
                        <input type="text" id="course" name="course" placeholder="Enter course name"><br><br>

                        <label for="year">Year Level</label><br>
                        <select id="year" name="year">
                            <option value="">Select year level</option>
                            <option value="1">First Year</option>
                            <option value="2">Second Year</option>
                            <option value="3">Third Year</option>
                            <option value="4">Fourth Year</option>
                        </select><br><br>

                        <label for="country">Country</label><br>
                        <select id="country" name="country">
                            <option value="">Select country</option>
                            <option value="usa">USA</option>
                            <option value="canada">Canada</option>
                            <option value="australia">Australia</option>
                            <option value="india">India</option>
                        </select><br><br>

                        <label for="address">Address</label><br>
                        <textarea id="address" name="address" placeholder="Enter your address"></textarea><br><br>

                        <label for="photo">Upload Photo</label><br>
                        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

                        <label for="favouriteColor">Favourite Color</label><br>
                        <input type="text" id="favouriteColor" name="favouriteColor" placeholder="Enter your favourite color"><br><br>

                        <button type="submit">Register</button>
                    </form>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
