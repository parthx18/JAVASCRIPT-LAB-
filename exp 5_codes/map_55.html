<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>using map() function</h2>
    <script>
        let marks = [10,20,30,40,50];
        let newmarks = marks.map(function(mark){
            return mark*2;
        });
        document.write("original marks :"+ marks + "<br>");
        document.write("new marks :"+ newmarks);
    </script>
    
</body>
</html>
