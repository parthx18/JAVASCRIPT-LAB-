<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movie playlist</title>
</head>
<body>
    <h2>movie playlist</h2>
    <script>
        let movies = ["avengers","spiderman","batman","superman"];
        document.write("Original movies :"+ movies + "<br><br>");
        movies.push("titanic");
        document.write("movies adding movies :"+ movies + "<br>");
        movies.pop();
        document.write("After removing movie :"+ movies + "<br>");
        document.write("Total movies: "+ movies.length);
    </script>
</body>
</html>
