<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Min & Max Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Find Minimum and Maximum</h1>
    <label for="numbers">Enter numbers (comma, space or newline separated):</label>
    <textarea id="numbers" placeholder="e.g. 3, 5, -2, 10"></textarea>

    <div class="controls">
      <button id="use-sample">Use Sample Array</button>
      <button id="compute">Compute Min &amp; Max</button>
    </div>

    <div id="result" class="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
