<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS console table</title>
</head>
<body>
    <h2>JS console table</h2>
    <script>
        let students = [
            { name: "John", age: 20, city: "New York" },
            { name: "Alice", age: 22, city: "Los Angeles" },
            { name: "Bob", age: 19, city: "Chicago" }
        ];
        console.table(students);
    </script>
</body>
</html>
