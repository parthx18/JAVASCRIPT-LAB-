<!DOCTYPE html>
<html>
<head>
    <title>JavaScript match() Example</title>
</head>
<body>
    <h2>JavaScript match() Function</h2>

    <script>
        let text = "I love JavaScript and JavaScript is fun";
        let result = text.match(/JavaScript/g);

        document.write("Text: " + text + "<br>");
        document.write("Matches: " + result + "<br>");
        document.write("Number of matches: " + result.length + "<br>");
    </script>
</body>
</html>
