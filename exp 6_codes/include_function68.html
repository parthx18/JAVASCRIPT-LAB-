<!DOCTYPE html>
<html>
<head>
    <title>JavaScript includes() Example</title>
</head>
<body>
    <h2>JavaScript includes() Function</h2>

    <script>
        let text = "JavaScript is fun";
        let result1 = text.includes("JavaScript");
        let result2 = text.includes("Python");

        document.write("Text: " + text + "<br>");
        document.write("Includes 'JavaScript'? " + result1 + "<br>");
        document.write("Includes 'Python'? " + result2 + "<br>");
    </script>
</body>
</html>
