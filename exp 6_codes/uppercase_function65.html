<!DOCTYPE html>
<html>
<head>
    <title>JavaScript toUpperCase() Example</title>
</head>
<body>
    <h2>JavaScript toUpperCase() Function</h2>

    <script>
        let text = "hello world";
        let upperText = text.toUpperCase();

        document.write("Original: " + text + "<br>");
        document.write("Uppercase: " + upperText + "<br>");
    </script>
</body>
</html>
