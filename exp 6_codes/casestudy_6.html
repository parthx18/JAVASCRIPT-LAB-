<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturn & Sun Cursor Follower</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      cursor: crosshair;
    }

    /* Starfield background accent */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #e2e8f0, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #cbd5e1, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.4;
      pointer-events: none;
    }

    h2 {
      margin-top: 30px;
      color: #fde047;
      font-weight: 500;
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.4);
      z-index: 10;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      z-index: 10;
    }

    /* Glowing Sun in Center */
    #sun {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-top: -60px;
      font-size: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 20%, #eab308 60%, rgba(234, 179, 8, 0) 100%);
      box-shadow: 0 0 60px #eab308, 0 0 120px #ca8a04;
      pointer-events: none;
      user-select: none;
      animation: pulseSun 3s ease-in-out infinite alternate;
    }

    @keyframes pulseSun {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 50px #eab308, 0 0 100px #ca8a04;
      }
      100% {
        transform: scale(1.04);
        box-shadow: 0 0 80px #fde047, 0 0 150px #eab308;
      }
    }

    /* Moving Planet Saturn Object */
    #saturn {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      margin-left: -40px;
      margin-top: -40px;
      font-size: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.7));
      will-change: transform;
      z-index: 20;
    }
  </style>
</head>
<body>

  <h2>Move your mouse to guide Planet Saturn around the Sun! ☀️ 🪐</h2>
  <p>Saturn follows your cursor position freely while the Sun shines at the center.</p>

  <!-- Glowing Sun at Center -->
  <div id="sun">☀️</div>

  <!-- Moving Object: Planet Saturn -->
  <div id="saturn">🪐</div>

  <script>
    const saturn = document.getElementById('saturn');

    // Current position of Saturn
    let planetX = window.innerWidth / 2;
    let planetY = window.innerHeight / 2;

    // Target (mouse) position
    let mouseX = planetX;
    let mouseY = planetY;

    // Track mouse movement
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Animation Loop: Saturn directly follows mouse cursor
    function animate() {
      // Calculate distance between Saturn and cursor
      const dx = mouseX - planetX;
      const dy = mouseY - planetY;

      // Smoothly move Saturn towards cursor position
      planetX += dx * 0.08;
      planetY += dy * 0.08;

      // Update Saturn's position
      saturn.style.transform = `translate(${planetX}px, ${planetY}px)`;

      requestAnimationFrame(animate);
    }

    // Start animation loop
    animate();
  </script>

</body>
</html>
