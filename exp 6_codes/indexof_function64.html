<!DOCTYPE html>
<html>
<head>
    <title>JavaScript indexOf() Example</title>
</head>
<body>
    <h2>JavaScript indexOf() Function</h2>

    <script>
        let text = "JavaScript is easy to learn";
        let position = text.indexOf("easy");

        document.write("Text: " + text + "<br>");
        document.write("Index of 'easy': " + position + "<br>");
    </script>
</body>
</html>
