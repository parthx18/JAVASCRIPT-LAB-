<!DOCTYPE html>
<html>
<head>
    <title>JavaScript toLowerCase() Example</title>
</head>
<body>
    <h2>JavaScript toLowerCase() Function</h2>

    <script>
        let text = "HELLO WORLD";
        let lowerText = text.toLowerCase();

        document.write("Original: " + text + "<br>");
        document.write("Lowercase: " + lowerText + "<br>");
    </script>
</body>
</html>
