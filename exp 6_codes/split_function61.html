<!DOCTYPE html>
<html>
<head>
    <title>JavaScript split() Example</title>
</head>
<body>
    <h2>JavaScript split() Function</h2>

    <script>
        let text = "Hello World JavaScript";
        let parts = text.split(" ");

        document.write("Original text: " + text + "<br>");
        document.write("After split: " + parts + "<br>");
        document.write("First word: " + parts[0] + "<br>");
        document.write("Second word: " + parts[1] + "<br>");
    </script>
</body>
</html>
