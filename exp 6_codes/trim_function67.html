<!DOCTYPE html>
<html>
<head>
    <title>JavaScript trim() Example</title>
</head>
<body>
    <h2>JavaScript trim() Function</h2>

    <script>
        let text = "   Hello World   ";
        let trimmedText = text.trim();

        document.write("Original: '" + text + "'<br>");
        document.write("After trim: '" + trimmedText + "'<br>");
    </script>
</body>
</html>
