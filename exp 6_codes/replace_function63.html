<!DOCTYPE html>
<html>
<head>
    <title>JavaScript replace() Example</title>
</head>
<body>
    <h2>JavaScript replace() Function</h2>

    <script>
        let text = "I like JavaScript. JavaScript is fun.";
        let newText = text.replace("JavaScript", "HTML");

        document.write("Original: " + text + "<br>");
        document.write("Replaced: " + newText + "<br>");
    </script>
</body>
</html>
