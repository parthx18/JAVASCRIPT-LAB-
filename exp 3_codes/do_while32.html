<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do_while Loop Example</title>
</head>
<body>
    <h2>Do_while Loop Example</h2>
    <script>
        let i = 1;
        do {
            document.write(i + "<br>");
            i++;
        } while (i <= 10);
    </script>
</body>
</html>
