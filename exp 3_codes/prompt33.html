<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt and alert example</title>
</head>
<body>
    <h2>Prompt and alert example</h2>
    <script>
        let name = prompt("enter your name:");
        alert("Hello, " + name + "! Welcome to our javascript.");
        document.write("<h3>WELCOME " + name + "</h3>");
    </script>
</body>
</html>
