<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Mouseover event example</h2>
   <div id ="box" style="width: 200px; height: 200px; background-color: red; text-align: center; line-height: 200px;">
    Move your mouse over this box
   </div>
   <script>
    const box = document.getElementById("box");
    box.addEventListener("mouseover", function() {
        this.style.backgroundColor = "yellow";
        this.innerHTML = "   Mouse is over the box";
    });
    </script>
</body>
</html>
