<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x = 5;
        let y = 10;
        const z = 15;
        console.log("var x:",x);
        console.log("let y:",y);
        console.log("const z:",z);  
        x = 20;
        y = 25;
        z = 30;
        console.log("var x after reassignment:",x);
        console.log("let y after reassignment:",y);
        console.log("const z after reassignment:",z);
    </script>  
</body>
</html>
