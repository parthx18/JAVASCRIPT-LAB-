    <title>Document</title>
</head>
<body>
    <script>
        let str = "Hello, World!";
        let num = 42;   
        let isReady = true;
        let empty = null;
        let notDefined;
        console.log(typeof str);
        document.write(str);
        console.log(typeof num);
        document.write(num);
        console.log(typeof isReady);
        document.write(isReady);
        console.log(typeof empty);
        document.write(empty);
        console.log(typeof notDefined);
        document.write(notDefined);
    </script>
</body>
