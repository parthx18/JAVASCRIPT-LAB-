<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Settings - Experiment 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="light">
<div class="card">
  <!-- Developer badge: edit these in the script below -->
  <div class="chip">
    <span class="dot"></span>
    <b>Experiment 9</b> &bull; Developed by <b id="devName"></b> &bull; PRN: <b id="devPrn"></b>
  </div>

  <div class="status-row">
    <div class="chip status"><span class="dot"></span><span id="themeStatus">WHITE THEME ACTIVE</span></div>
  </div>

  <h1>Theme Settings</h1>
  <p class="subtitle">Select and persist your theme preference using HTML5 Web Storage.</p>

  <label for="themeSelect">Select your preferred theme:</label>
  <select id="themeSelect">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>

  <div class="actions">
    <button class="btn-local" id="saveLocalBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save using localStorage
    </button>
    <button class="btn-session" id="saveSessionBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Save using sessionStorage
    </button>
  </div>

  <button class="btn-clear" id="clearBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
    Clear Preferences
  </button>

  <div class="message" id="message">Choose a theme and save it using localStorage or sessionStorage.</div>
</div>

<script src="script.js"></script>
</body>
</html>
