<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>try catch example</title>
</head>
<body>
    <h2>try catch example</h2>
    <p id="result"></p>
    <script>
        try {
            document.getElementById("result").innerHTML = x;
        } catch (error) {
            document.getElementById("result").innerHTML = 
            "Error : " + error.message;
        }
    </script>
</body>
</html>
