<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h2>addition using js function</h2>
    <script>
        function add(a,b) {

        let result = add(5,3);
        alert("The sum is "+ result);
    </script>
